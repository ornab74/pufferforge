[build-system]
requires = ["setuptools>=75", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "pufferforge"
version = "0.1.0"
description = "Clean-room Python/C++ reinforcement-learning runtime with native vector environments"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PufferForge contributors"}]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pufferforge = "pufferforge.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
