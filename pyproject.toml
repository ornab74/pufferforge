[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pufferforge"
version = "0.7.3"
description = "Python/C++ reinforcement-learning runtime with predictive multi-agent mapping simulations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PufferForge contributors"}]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pufferforge = "pufferforge.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately execute isolated AST-extracted notebook definitions.
"tests/test_surfguard_notebook.py" = ["S102"]
