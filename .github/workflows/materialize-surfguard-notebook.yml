name: Materialize SurfGuard notebook

on:
  push:
    branches: [agent/surfguard-model-hotfix-v3]
    paths:
      - '.github/surfguard_payload/part_*'
      - '.github/workflows/materialize-surfguard-notebook.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/surfguard-model-hotfix-v3
          fetch-depth: 0
      - name: Reconstruct and verify notebook
        shell: bash
        run: |
          cat .github/surfguard_payload/part_* \
            | base64 --decode \
            | gzip --decompress \
            > SurfGuard_USA_PufferForge_Colab.ipynb
          echo 'c59aa487fa8bb92b1d03e13ecda1fe76a167f59d6d6166fdf2480ba3693a5dae  SurfGuard_USA_PufferForge_Colab.ipynb' | sha256sum --check
          python -m json.tool SurfGuard_USA_PufferForge_Colab.ipynb >/dev/null
      - name: Commit exact notebook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SurfGuard_USA_PufferForge_Colab.ipynb
          git diff --cached --quiet || git commit -m 'Update repaired SurfGuard notebook'
          git push origin HEAD:agent/surfguard-model-hotfix-v3
